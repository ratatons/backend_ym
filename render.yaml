services:
  - type: web
    name: yo-mama-backend
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        value: "*"
      - key: YOMAMA_JOKES_API
        value: https://yomama-jokes.com/api/random
      - key: EXPO_ACCESS_TOKEN
        sync: false
